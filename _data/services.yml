label: How we work
title:
  - text: Planning, design
  - text: and
  - highlight: construction.
intro: Our work follows four connected stages. Project management runs throughout, coordinating the design,
  schedule and site activities.
stages:
  - number: '01'
    title: Planning
    points:
      - Project Definition
      - Site Survey
      - Scope Coordination
      - Budget Planning
    text: We review the requirements, survey the site and establish the scope, budget and sequence of
      work.
    image: assets/images/services/planning.webp
    image_width: 1600
    image_height: 961
    image_alt: Aerial view of the Zakho Conference Hall site plan
  - number: '02'
    title: Design
    points:
      - Architecture
      - Interior Design
      - Technical Coordination
      - Material Selection
    text: We develop the architectural and interior design, coordinate technical requirements and select
      materials.
    image: assets/images/services/designing.webp
    image_width: 1600
    image_height: 961
    image_alt: Auditorium interior design for the Zakho Conference Hall
  - number: '03'
    title: Construction
    points:
      - Construction
      - Fit-Out
      - Site Supervision
      - Quality Control
    text: We coordinate the construction and fit-out, supervise site work and check materials and finishes
      against the agreed design.
    image: assets/images/services/construction.webp
    image_width: 825
    image_height: 550
    image_alt: Lit staircase with glass balustrade, Jade Touch Salon
  - number: '04'
    title: Management
    points:
      - Project Management
      - Scheduling
      - Reporting
      - Handover
    text: We coordinate schedules, track progress, report changes and organise inspections and handover.
    image: assets/images/services/management.webp
    image_width: 825
    image_height: 550
    image_alt: Completed treatment area, Jade Touch Salon
