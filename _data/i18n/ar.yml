services:
  label: "ما نقوم به"
  title:
    - text: "من الفكرة"
    - text: "إلى"
      highlight: "التنفيذ."
  intro: "أربع مراحل وفريق واحد مسؤول. تنتقل كل مرحلة إلى التي تليها دون أن تفقد غاية ما سبقها."
  stages:
    - title: "التخطيط"
      points:
        - "تحديد المشروع"
        - "مسح الموقع"
        - "تنسيق نطاق العمل"
        - "تخطيط الميزانية"
      text: "نحدّد المتطلبات والأولويات وقيود الموقع والميزانية واستراتيجية التنفيذ قبل بدء البناء."
      image_alt: "منظر جوي لمخطط موقع قاعة زاخو للمؤتمرات"
    - title: "التصميم"
      points:
        - "العمارة"
        - "التصميم الداخلي"
        - "التنسيق الفني"
        - "اختيار المواد"
      text: "تُطوَّر العمارة والتصميم الداخلي حول حلول عملية ومنسّقة وقابلة للتنفيذ."
      image_alt: "التصميم الداخلي للمدرّج في قاعة زاخو للمؤتمرات"
    - title: "البناء"
      points:
        - "البناء"
        - "التجهيز الداخلي"
        - "الإشراف على الموقع"
        - "ضبط الجودة"
      text: "يتولّى فريق تنفيذ واحد مسؤول ضبط أعمال الموقع والمواد والحِرَف والتشطيبات."
      image_alt: "درج مضاء بدرابزين زجاجي، صالون Jade Touch"
    - title: "الإدارة"
      points:
        - "إدارة المشاريع"
        - "الجدولة"
        - "التقارير"
        - "التسليم"
      text: "تُدار الجدولة والتنسيق والتقارير وضبط الجودة والتسليم طوال تنفيذ المشروع."
      image_alt: "منطقة علاج مكتملة، صالون Jade Touch"

