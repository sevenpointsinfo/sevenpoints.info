    label: المشاريع
    title:
      - text: مشاريع
      - text: مختارة.
  clients_section:
    label: العملاء
    title:
      - text: العمل
      - text: مع عملائنا.
    text: يحتاج المشروع إلى قرارات واضحة وفهم مشترك للأعمال المطلوبة. ننسّق التصميم والبناء، ونُطلع العميل
      على سير العمل طوال المشروع.
    promises:
      - title: مسؤوليات محدّدة
        text: نتّفق منذ البداية على نطاق العمل والمسؤولين عن تنفيذه.
      - title: تواصل واضح
        text: نوضّح تقدّم العمل والقرارات وأي تغييرات في النطاق أو التكلفة أو الجدول الزمني.
      - title: التسليم
        text: نفحص الأعمال المنجزة ونسجّل الملاحظات والأعمال المتبقية لمتابعتها.
  contact_section:
    title:
      - text: ناقش
      - text: مشروعك معنا.
    subtitle:
      - text: تواصل
      - text: مع فريقنا.
    text: أخبرنا بما تخطّط لبنائه، وموقعه، والموعد المطلوب. تواصل مع فريقنا عبر الهاتف أو واتساب أو البريد
      الإلكتروني.
    button_whatsapp: واتساب
    button_email: راسلنا بالبريد
