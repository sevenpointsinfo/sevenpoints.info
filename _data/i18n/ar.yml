      على المواقع.
about:
  label: عن الشركة
  title:
    - text: شركة للتصميم
    - highlight: والبناء.
  lead: Seven Points شركة تصميم وبناء مقرّها دهوك. تشمل أعمالنا التصميم المعماري والداخلي، والتجهيز والتشطيب،
    والبناء، وإدارة المشاريع والإشراف على المواقع.
  who_we_are:
    image_alt: واجهة قاعة زاخو للمؤتمرات
    stats:
      - label: مشاريع منجزة
      - label: سنوات من الخبرة
      - label: عملاء وشركاء
      - value: دهوك
        label: إقليم كوردستان
    text: نبدأ بمتطلبات العميل وظروف الموقع. يجمع فريقنا بين التصميم والبناء، وينسّق الأعمال من المخططات
      الأولية حتى التسليم.
  values:
    - title: المتطلبات
      text: فهم احتياجات العميل والميزانية وظروف الموقع قبل تطوير التصميم.
    - title: قابلية التنفيذ
      text: اختيار التفاصيل والمواد مع مراعاة تنفيذها واستخدامها وصيانتها.
    - title: التواصل
      text: توضيح القرارات وتقدّم العمل والتغييرات لجميع المعنيين بالمشروع.
    - title: المسؤولية
      text: تحديد المسؤول عن كل جزء من العمل، ومتابعته حتى الإنجاز.
  team:
    statement: |-
      فريق التصميم وفريق الموقع.
      يعملان معًا.
    disciplines:
      - معماريون
      - إدارة المشاريع
      - فريق البناء
      - التصميم الداخلي
      - الإشراف على المواقع
      - تنسيق الأعمال الميكانيكية والكهربائية
  founders:
    statement: |-
      صلة بين التصميم
      وأعمال البناء.
    text: تأسّست Seven Points على قناعة بأن قرارات التصميم وأعمال الموقع يجب أن تُدار معًا. يوجّه هذا
      المبدأ طريقة تخطيطنا للمشاريع وتنسيقها وتنفيذها.
    people:
      - name: شيراز عزيز
        role: المالك والمؤسس
        photo_alt: شيراز عزيز، مالك Seven Points ومؤسسها
  philosophy:
    vision:
      title: رؤيتنا
      text: المساهمة في تطوير أماكن أفضل للسكن والعمل واللقاء في كوردستان، من خلال تصميم مدروس وبناء متقن.
    mission:
      title: مهمّتنا
      text: إنجاز المشاريع من التخطيط حتى الاكتمال، بتنسيق التصميم والبناء والإدارة، وتحديد المسؤولية
        في كل مرحلة.
services:
  label: كيف نعمل
  title:
    - text: التخطيط والتصميم
    - highlight: والبناء.
  intro: تترابط أعمالنا عبر أربع مراحل. وتستمر إدارة المشروع طوال العمل، لتنسيق التصميم والجدول الزمني
    وأعمال الموقع.
  stages:
    - title: التخطيط
      points:
        - تحديد المشروع
        - مسح الموقع
        - تنسيق نطاق العمل
        - تخطيط الميزانية
      text: نراجع المتطلبات، ونمسح الموقع، ونحدّد نطاق الأعمال والميزانية وتسلسل التنفيذ.
      image_alt: منظر جوي لمخطط موقع قاعة زاخو للمؤتمرات
    - title: التصميم
      points:
        - العمارة
        - التصميم الداخلي
        - التنسيق الفني
        - اختيار المواد
      text: نطوّر التصميم المعماري والداخلي، وننسّق المتطلبات الفنية ونختار المواد.
      image_alt: التصميم الداخلي للمدرّج في قاعة زاخو للمؤتمرات
    - title: البناء
      points:
        - البناء
        - التجهيز الداخلي
        - الإشراف على الموقع
        - ضبط الجودة
      text: ننسّق أعمال البناء والتجهيز الداخلي، ونشرف على الموقع، ونتحقّق من مطابقة المواد والتشطيبات
        للتصميم المتّفق عليه.
      image_alt: درج مضاء بدرابزين زجاجي، صالون Jade Touch
    - title: الإدارة
      points:
        - إدارة المشاريع
        - الجدولة
        - التقارير
        - التسليم
      text: ننسّق الجداول الزمنية، ونتابع التقدّم، ونبلّغ بالتغييرات، وننظّم الفحص والتسليم.
      image_alt: منطقة علاج مكتملة، صالون Jade Touch
