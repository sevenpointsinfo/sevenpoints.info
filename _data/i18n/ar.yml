    title:
      - text: قرارات التصميم.
      - highlight: تفاصيل التنفيذ.
    text: قيمة المخططات في إمكانية تنفيذها بدقة. ندرس استخدام المكان والمواد والميزانية وظروف الموقع معًا،
      لتنعكس قرارات التصميم في أعمال البناء.
    link: شاهد أعمالنا
  stories:
    - image_alt: قاعة زاخو للمؤتمرات، الواجهة الجانبية
      title_line_1: المكان
      title_line_2: واستخدامه.
      text: ندرس توزيع المساحات والحركة والإضاءة والمواد معًا في التصميم المعماري والداخلي.
    - image_alt: استقبال قاعة زاخو للمؤتمرات
      title_line_1: نطاق العمل
      title_line_2: وتسلسله.
      text: نحدّد الأعمال والميزانية وتسلسل التنفيذ قبل بدء العمل في الموقع.
    - image_alt: قاعة زاخو للمؤتمرات، منظر من الزاوية
      title_line_1: العمل
      title_line_2: في الموقع.
