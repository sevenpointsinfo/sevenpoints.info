      - دیزاینی ناوەوە
      - سەرپەرشتیی شوێنی کار
      - هەماهەنگیی کارە میکانیکی و کارەباییەکان
  founders:
    statement: |-
      پەیوەندیی نێوان
      دیزاین و بیناسازی.
    text: Seven Points لەسەر ئەو باوەڕە دامەزراوە کە بڕیارەکانی دیزاین و کاری شوێن دەبێت پێکەوە بەڕێوە
      ببرێن. ئەم بنەمایە ڕێنمایی شێوازی پلاندانان، هەماهەنگی و جێبەجێکردنی پڕۆژەکانمان دەکات.
    people:
      - name: شیراز عەزیز
        role: خاوەن و دامەزرێنەر
        photo_alt: شیراز عەزیز، خاوەن و دامەزرێنەری Seven Points
  philosophy:
    vision:
      title: دیدگامان
      text: بەشداری لە دروستکردنی شوێنی باشتر بۆ ژیان، کار و کۆبوونەوە لە کوردستان، بە دیزاینی بیرلێکراوە
        و بیناسازیی ورد.
    mission:
      title: ئەرکمان
      text: گەیاندنی پڕۆژەکان لە پلانەوە بە تەواوبوون، بە هەماهەنگکردنی دیزاین، بیناسازی و بەڕێوەبردن،
        لەگەڵ بەرپرسیارێتیی ڕوون لە هەر قۆناغێکدا.
services:
  label: چۆن کار دەکەین
  title:
    - text: پلاندانان و دیزاین
    - highlight: و بیناسازی.
  intro: کارەکانمان بە چوار قۆناغی پەیوەست بە یەکدا تێدەپەڕن. بەڕێوەبردنی پڕۆژە بە درێژایی کارەکە بەردەوامە
    بۆ هەماهەنگکردنی دیزاین، خشتەی کات و کاری شوێن.
  stages:
    - title: پلاندانان
      points:
        - دیاریکردنی پڕۆژە
        - ڕووپێوی شوێن
        - هەماهەنگیی بواری کار
        - پلاندانانی بودجە
      text: داواکارییەکان پێدا دەچینەوە، شوێنەکە ڕووپێو دەکەین و سنووری کار، بودجە و ڕیزبەندیی کارەکان
        دیاری دەکەین.
      image_alt: دیمەنی ئاسمانیی نەخشەی شوێنی هۆڵی کۆنفرانسی زاخۆ
    - title: دیزاین
      points:
        - تەلارسازی
        - دیزاینی ناوەوە
        - هەماهەنگیی تەکنیکی
        - هەڵبژاردنی کەرەستە
      text: دیزاینی تەلارسازی و ناوەوە پەرە پێ دەدەین، پێویستییە تەکنیکییەکان هەماهەنگ دەکەین و کەرەستە
        هەڵدەبژێرین.
      image_alt: دیزاینی ناوەوەی هۆڵی کۆنفرانس لە هۆڵی کۆنفرانسی زاخۆ
    - title: بیناسازی
      points:
        - بیناسازی
        - تەواوکاری ناوەوە
        - سەرپەرشتیی شوێنی کار
        - کۆنترۆڵی کوالیتی
      text: کاری بیناسازی و تەواوکاریی ناوەوە هەماهەنگ دەکەین، سەرپەرشتیی شوێنی کار دەکەین و کەرەستە و
        تەواوکارییەکان بە دیزاینی ڕێککەوتوو بەراورد دەکەین.
      image_alt: پەیژەی ڕووناک بە مەحەجەری شووشە، ساڵۆنی Jade Touch
    - title: بەڕێوەبردن
      points:
        - بەڕێوەبردنی پڕۆژە
        - خشتەی کات
        - ڕاپۆرتکردن
        - ڕادەستکردن
      text: خشتەکانی کات هەماهەنگ دەکەین، بەدواداچوون بۆ پێشکەوتن دەکەین، گۆڕانکارییەکان ڕادەگەیەنین و
        پشکنین و ڕادەستکردن ڕێک دەخەین.
      image_alt: بەشی چارەسەریی تەواوکراو، ساڵۆنی Jade Touch
