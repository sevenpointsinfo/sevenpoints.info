      text: "جێبەجێکردنی شوێن، کەرەستە، وەستاکان و تەواوکاری لەلایەن یەک تیمی جێبەجێکاری بەرپرسیارەوە کۆنترۆڵ دەکرێن."
      image_alt: "پەیژەی ڕووناک بە مەحەجەری شووشە، ساڵۆنی Jade Touch"
