        - "ڕادەستکردن"
      text: "خشتەی کات، هەماهەنگی، ڕاپۆرتکردن، کۆنترۆڵی کوالیتی و ڕادەستکردن بە درێژایی جێبەجێکردنی پڕۆژە بەڕێوە دەبرێن."
