about:
  label: دەربارەی ئێمە
  title:
    - text: کۆمپانیای دیزاین
    - highlight: و بیناسازی.
  lead: Seven Points کۆمپانیایەکی دیزاین و بیناسازییە و بنکەکەی لە دهۆکە. کارەکانمان تەلارسازی، دیزاین
    و تەواوکاریی ناوەوە، بیناسازی، بەڕێوەبردنی پڕۆژە و سەرپەرشتیی شوێنی کار دەگرنەوە.
  who_we_are:
    image_alt: ڕووکاری هۆڵی کۆنفرانسی زاخۆ
    stats:
      - label: پڕۆژەی تەواوکراو
      - label: ساڵ ئەزموون
      - label: کڕیار و هاوبەش
      - value: دهۆک
        label: هەرێمی کوردستان
    text: لە داواکارییەکانی کڕیار و بارودۆخی شوێنی کارەوە دەست پێ دەکەین. تیمەکەمان دیزاین و بیناسازی
      پێکەوە دەبەستێتەوە و لە نەخشە سەرەتاییەکانەوە تا ڕادەستکردن، کارەکان هەماهەنگ دەکات.
  values:
    - title: داواکارییەکان
      text: تێگەیشتن لە پێویستییەکانی کڕیار، بودجە و بارودۆخی شوێن، پێش پەرەپێدانی دیزاین.
    - title: جێبەجێکردن
      text: هەڵبژاردنی وردەکاری و کەرەستە بە لەبەرچاوگرتنی شێوازی جێبەجێکردن، بەکارهێنان و چاککردنەوەیان.
    - title: پەیوەندی
      text: ڕوونکردنەوەی بڕیارەکان، پێشکەوتنی کار و گۆڕانکارییەکان بۆ هەموو لایەنە پەیوەندیدارەکان.
    - title: بەرپرسیارێتی
      text: دیاریکردنی بەرپرسی هەر بەشێکی کار و بەدواداچوونی تا تەواوبوون.
  team:
    statement: |-
      تیمی دیزاین و تیمی شوێنی کار.
      پێکەوە کار دەکەن.
    disciplines:
      - تەلارسازان
      - بەڕێوەبردنی پڕۆژە
