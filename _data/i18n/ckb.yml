      دەکەین و بە درێژایی پڕۆژەکە کڕیار لە پێشکەوتنی کار ئاگادار دەکەینەوە.
    promises:
      - title: بەرپرسیارێتیی دیاریکراو
        text: لە سەرەتاوە لەسەر سنووری کار و ئەو کەسانەی بەرپرسی جێبەجێکردنین ڕێک دەکەوین.
      - title: پەیوەندیی ڕوون
        text: پێشکەوتنی کار، بڕیارەکان و گۆڕانکارییەکانی سنووری کار، تێچوو یان خشتەی کات ڕوون دەکەینەوە.
      - title: ڕادەستکردن
        text: کاری تەواوکراو دەپشکنین و تێبینی و کارە ماوەکان تۆمار دەکەین بۆ بەدواداچوون.
