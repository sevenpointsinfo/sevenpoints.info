        text: "بڕیار، گۆڕانکاری و پێشکەوتنی کار هەر کاتێک ڕوو بدەن ڕادەگەیەندرێن."
      - title: "ڕادەستکردنی تەواو"
        text: "هەموو پڕۆژەیەک بە پشکنین، چارەسەرکردنی کەموکوڕییەکان و بەڵگەنامەکردن کۆتایی دێت."
