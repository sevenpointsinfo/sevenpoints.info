      image_alt: "دیمەنی ئاسمانیی نەخشەی شوێنی هۆڵی کۆنفرانسی زاخۆ"
    - title: "دیزاینکردن"
      points:
        - "تەلارسازی"
        - "دیزاینی ناوەوە"
        - "هەماهەنگیی تەکنیکی"
        - "هەڵبژاردنی کەرەستە"
      text: "تەلارسازی و دیزاینی ناوەوە لەسەر بنەمای چارەسەری کرداری، هەماهەنگ و جێبەجێکراو پەرە پێدەدرێن."
      image_alt: "دیزاینی ناوەوەی هۆڵی کۆنفرانس لە هۆڵی کۆنفرانسی زاخۆ"
    - title: "بیناسازی"
      points:
        - "بیناسازی"
        - "تەواوکاری ناوەوە"
        - "سەرپەرشتیی شوێنی کار"
