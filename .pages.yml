  # ──────────────────────────────────────────────── CLIENTS
  - name: clients
    label: Clients & testimonials
    description: Clients with "Show on website" switched on appear in the Clients section — their logo in the logo row, and their testimonial (if any) as a quote. Use real logos and real quotes only, with the client's permission.
    type: collection
    path: _clients
    format: yaml-frontmatter
    filename: "{fields.title}.md"
    view:
      primary: title
      fields: [ title, person, featured, order ]
      sort: [ order, title ]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Client name
        type: string
        required: true
      - name: logo
        label: Client logo
        description: PNG or SVG with a transparent background works best.
        type: image
        options:
          path: assets/images/clients
      - name: testimonial
        label: Testimonial
        type: text
      - name: person
        label: Person name
        type: string
      - name: position
        label: Position
        type: string
      - name: order
        label: Display order
        type: number
        default: 10
      - name: featured
        label: Show on website (featured)
        type: boolean
        default: true

  # ──────────────────────────────────────────────── CONTACT
  - name: contact
    label: Contact & social media
    description: Used in the menu, the contact buttons, the footer and Google's company information.
    type: file
    path: _data/contact.yml
    format: yaml
    fields:
      - name: phone
        label: Phone
        description: As it should appear, e.g. +964 750 220 5577
        type: string
        pattern:
          regex: "^[+0-9 ()-]*$"
          message: Use numbers, spaces and + only, e.g. +964 750 220 5577
      - name: whatsapp
        label: WhatsApp number
        description: With country code, e.g. +964 750 220 5577
        type: string
        pattern:
          regex: "^[+0-9 ()-]*$"
          message: Use numbers, spaces and + only, e.g. +964 750 220 5577
      - name: email
        label: Email
        type: string
        pattern:
          regex: "^([^@\\s]+@[^@\\s]+\\.[^@\\s]+)?$"
          message: Enter a full email address, e.g. info@sevenpoints.info
      - name: address
        label: Address
        type: object
        fields:
          - name: street
            label: Street
            type: string
          - name: city
            label: City
            type: string
          - name: region
            label: Region
            type: string
          - name: country
            label: Country
            type: string
          - name: country_code
            label: Country code for Google (two letters)
            type: string
      - name: social
        label: Social media
        description: Full links, starting with https://. Empty links stay as placeholders.
        type: object
        fields:
          - name: instagram
            label: Instagram
            type: string
            pattern:
              regex: "^(https?://\\S+)?$"
              message: Paste the full link, starting with https://
          - name: facebook
            label: Facebook
            type: string
            pattern:
              regex: "^(https?://\\S+)?$"
              message: Paste the full link, starting with https://
          - name: linkedin
            label: LinkedIn
            type: string
            pattern:
              regex: "^(https?://\\S+)?$"
              message: Paste the full link, starting with https://

