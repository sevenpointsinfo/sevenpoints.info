    format: yaml
    fields:
      - name: label
        label: Small label
        type: string
      - name: title
        label: Services heading
        component: headline
      - name: intro
        label: Services introduction
        type: text
      - name: stages
        label: Services (four stages)
        type: object
        list:
          min: 4
          max: 4
          collapsible:
            collapsed: true
            summary: "{fields.number} {fields.title}"
        fields:
          - name: number
            label: Number
            type: string
          - name: title
            label: Title
            type: string
            required: true
          - name: text
            label: Description
            type: text
          - name: points
            label: Bullet points
            type: string
            list: true
          - name: image
            label: Image
            type: image
            required: true
            options:
              path: assets/images/services
          - name: image_width
            type: number
